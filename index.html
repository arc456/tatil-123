<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tatil Asistanı">
<meta name="theme-color" content="#0055A5">
<meta name="description" content="Citroën Tatil Modu - Çevrimdışı tatil hazırlık asistanı">
<title>Tatil Asistanı</title>
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect fill='%230055A5' width='180' height='180' rx='36'/%3E%3Ctext x='90' y='110' font-size='90' text-anchor='middle' fill='white'%3E🚐%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f2f4f8;--card:#fff;--p:#0055A5;--pl:#e6f0fa;--pd:#003366;--t:#1c1c1e;--ts:#6e6e73;--b:#e5e5ea;--a:#ff9500;--s:#34c759;--d:#ff3b30;--sh:0 4px 16px rgba(0,0,0,0.06);--r:20px;--rs:12px;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
[data-theme="dark"]{--bg:#0f1419;--card:#1c2430;--p:#0A84FF;--pl:#18283a;--pd:#0051d5;--t:#f2f2f7;--ts:#8e8e93;--b:#2c384a;--sh:0 4px 16px rgba(0,0,0,0.3)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t);padding-bottom:calc(90px + var(--sb));padding-top:var(--st);overscroll-behavior-y:none;-webkit-overflow-scrolling:touch}
.header{background:var(--card);padding:16px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--b);box-shadow:var(--sh);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.top-row{display:flex;justify-content:space-between;align-items:center}
.app-title{font-size:22px;font-weight:800;color:var(--p);display:flex;align-items:center;gap:10px}
.header-actions{display:flex;gap:10px}
.btn-icon{background:var(--pl);border:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--p);cursor:pointer;transition:transform .15s}
.btn-icon:active{transform:scale(.9);background:var(--p);color:#fff}
.hero-card{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:24px;border-radius:var(--r);margin:16px;box-shadow:0 12px 28px rgba(0,85,165,.3);position:relative;overflow:hidden;transition:transform .3s}
.hero-card:active{transform:scale(.98)}
.hero-card::before{content:'';position:absolute;top:-50%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.1) 0%,transparent 70%);border-radius:50%}
.hero-title{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;opacity:.85;font-weight:700}
.hero-dest{font-size:28px;font-weight:800;margin:6px 0 14px;display:flex;justify-content:space-between;align-items:center}
.countdown-badge{background:rgba(255,255,255,.2);padding:6px 14px;border-radius:24px;font-size:13px;font-weight:700;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);white-space:nowrap}
.progress-container{margin-top:14px}
.progress-info{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;font-weight:700}
.progress-bar-bg{background:rgba(255,255,255,.25);height:12px;border-radius:6px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#30d158,#34c759);height:100%;width:0%;transition:width .6s cubic-bezier(.34,1.56,.64,1);border-radius:6px;box-shadow:0 0 10px rgba(52,199,89,.4)}
.search-add-bar{padding:0 16px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.input-group{display:flex;gap:8px}
.input-text{flex:1;background:var(--card);border:1.5px solid var(--b);padding:14px 16px;border-radius:var(--rs);font-size:16px;color:var(--t);outline:none;transition:border-color .2s,box-shadow .2s}
.input-text:focus{border-color:var(--p);box-shadow:0 0 0 4px var(--pl)}
.btn-primary{background:var(--p);color:#fff;border:none;padding:0 22px;border-radius:var(--rs);font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s;box-shadow:0 4px 12px rgba(0,85,165,.25)}
.btn-primary:active{transform:scale(.95);background:var(--pd)}
.categories{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.categories::-webkit-scrollbar{display:none}
.cat-chip{background:var(--card);border:1.5px solid var(--b);padding:10px 18px;border-radius:24px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ts);transition:all .2s;box-shadow:var(--sh)}
.cat-chip:active{transform:scale(.95)}
.cat-chip.active{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 4px 12px rgba(0,85,165,.3)}
.item-list{padding:0 16px;display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.item-card{background:var(--card);border:1.5px solid var(--b);border-radius:var(--rs);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s;animation:slideIn .4s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.item-card:active{transform:scale(.98);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.item-card.checked{opacity:.85;background:var(--pl);border-color:var(--p)}
.item-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.item-left{display:flex;align-items:center;gap:14px;flex:1}
.checkbox{width:30px;height:30px;border-radius:10px;border:2.5px solid var(--b);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;font-weight:700;transition:all .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
.item-card.checked .checkbox{background:var(--s);border-color:var(--s);color:#fff;transform:scale(1.1);box-shadow:0 4px 10px rgba(52,199,89,.3)}
.item-title{font-size:17px;font-weight:600;color:var(--t);transition:all .3s}
.item-card.checked .item-title{text-decoration:line-through;color:var(--ts);opacity:.7}
.item-actions{display:flex;gap:14px;align-items:center}
.star-btn{font-size:22px;color:var(--ts);cursor:pointer;transition:transform .2s}
.star-btn:active{transform:scale(1.3)}
.star-btn.active{color:var(--a);text-shadow:0 0 8px rgba(255,149,0,.3)}
.delete-btn{color:var(--d);cursor:pointer;font-size:18px;transition:transform .2s;opacity:.7}
.delete-btn:active{transform:scale(1.2);opacity:1}
.item-note-input{background:var(--bg);border:1.5px solid var(--b);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--t);width:100%;outline:none;margin-top:4px;transition:border-color .2s}
.item-note-input:focus{border-color:var(--p)}
.floating-bar{position:fixed;bottom:calc(20px + var(--sb));right:16px;left:16px;display:flex;gap:12px;z-index:99;justify-content:flex-end}
.btn-float{background:var(--a);color:#fff;border:none;padding:14px 24px;border-radius:30px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(255,149,0,.35);display:flex;align-items:center;gap:8px;cursor:pointer;transition:transform .2s}
.btn-float:active{transform:scale(.95) translateY(2px)}
.btn-save{background:var(--p);box-shadow:0 8px 20px rgba(0,85,165,.35)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);opacity:0;transition:opacity .3s}
.modal.active{display:flex;opacity:1}
.modal-content{background:var(--card);width:100%;max-width:400px;border-radius:var(--r);padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.2);transform:scale(.9) translateY(20px);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.modal.active .modal-content{transform:scale(1) translateY(0)}
.modal-header{font-size:20px;font-weight:800;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.form-group{margin-bottom:16px}
.form-label{font-size:13px;font-weight:700;color:var(--ts);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px}
.toast{position:fixed;top:calc(20px + var(--st));left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(30,30,30,.95);color:#fff;padding:14px 28px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.2);backdrop-filter:blur(10px);white-space:nowrap}
.toast.active{opacity:1;transform:translateX(-50%) translateY(0)}
.install-banner{display:none;position:fixed;top:0;left:0;right:0;background:var(--p);color:#fff;padding:12px 16px;z-index:400;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;animation:slideDown .4s ease}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.install-banner.show{display:flex}
.install-btn{background:#fff;color:var(--p);border:none;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer}
.confetti{position:fixed;pointer-events:none;z-index:500;width:10px;height:10px;border-radius:50%;animation:confettiFall 1.5s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.empty-state{text-align:center;padding:40px 20px;color:var(--ts)}
.empty-stağte .emoji{font-size:48px;margin-bottom:12px;display:block}
.empty-state p{font-size:15px;font-weight:500}
</style>
</head>
<body>
<div class="install-banner" id="installBanner"><span>📲 Ana ekrana ekle, çevrimdışı kullan!</span><button class="install-btn" onclick="dismissInstall()">Tamam</button><span style="cursor:pointer;margin-left:8px;opacity:.8" onclick="dismissInstall()">✕</span></div>
<div id="toast" class="toast">Kaydedildi!</div>
<div class="header"><div class="top-row"><div class="app-title">🚐 ARC Tatil Modu</div><div class="header-actions"><button class="btn-icon" onclick="toggleTheme()">🌙</button><button class="btn-icon" onclick="openModal('settingsModal')">⚙️</button><button class="btn-icon" onclick="resetAll()">🔄</button></div></div></div>
<div class="hero-card" onclick="openModal('settingsModal')"><div class="hero-title">🎯 Hedef Rota</div><div class="hero-dest"><span id="destName">Dedeağaç</span><span class="countdown-badge" id="countdownText">3 gün kaldı</span></div><div class="progress-container"><div class="progress-info"><span id="statusText">Hazırlık Devam Ediyor</span><span id="percentText">%0</span></div><div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div></div></div>
<div class="search-add-bar"><input type="text" class="input-text" id="searchInput" placeholder="🔍 Eşya veya kategori ara..." oninput="render()"><div class="input-group"><input type="text" class="input-text" id="newItemTitle" placeholder="➕ Yeni eşya adı..."><select class="input-text" id="newItemCat" style="flex:.5;padding-right:8px"><option value="🛃 Sınır Kapısı">🛃 Sınır</option><option value="🚗 Araba">🚗 Araba</option><option value="🏡 Evden Çıkış">🏡 Ev</option><option value="📄 Belgeler & Para">📄 Belge</option><option value="📱 Elektronik">📱 Tekno</option><option value="🧦 Kıyafet & Bakım">🧦 Kıyafet</option><option value="💊 Sağlık">💊 Sağlık</option><option value="🍎 Yiyecek">🍎 Yiyecek</option></select><button class="btn-primary" onclick="addItem()">Ekle</button></div></div>
<div class="categories" id="catChips"></div><div class="item-list" id="itemList"></div>
<div class="floating-bar"><button class="btn-float" onclick="forgotCheck()">🎲 Unuttum mu?</button><button class="btn-float btn-save" onclick="manualSave()">💾 Kaydet</button></div>
<div class="modal" id="settingsModal"><div class="modal-content"><div class="modal-header"><span>⚙️ Tatil Ayarları</span><span style="cursor:pointer;font-size:20px" onclick="closeModal('settingsModal')">✕</span></div><div class="form-group"><label class="form-label">Gidilecek Yer</label><input type="text" class="input-text" id="settingDest" style="width:100%"></div><div class="form-group"><label class="form-label">Gidiş Tarihi</label><input type="date" class="input-text" id="settingDate" style="width:100%"></div><button class="btn-primary" style="width:100%;padding:14px;margin-top:10px;font-size:16px" onclick="saveSettings()">Kaydet ve Güncelle</button></div></div>
<script>
const defaultItems=[{id:1,cat:'🛃 Sınır Kapısı',title:'Pasaport',checked:!1,fav:!0,note:''},{id:2,cat:'🛃 Sınır Kapısı',title:'Ruhsat & Yeşil Sigorta',checked:!1,fav:!0,note:''},{id:3,cat:'🛃 Sınır Kapısı',title:'eSIM / Roaming Aktifleştirme',checked:!1,fav:!1,note:''},{id:4,cat:'🛃 Sınır Kapısı',title:'Euro Nakit (200-300€)',checked:!1,fav:!0,note:''},{id:5,cat:'🛃 Sınır Kapısı',title:'Yurt Dışı Çıkış Harç Pulu',checked:!1,fav:!1,note:'Online ödenebilir'},{id:6,cat:'🚗 Araba',title:'Depo Yakıt Kontrolü',checked:!1,fav:!1,note:''},{id:7,cat:'🚗 Araba',title:'Lastik Basınçları',checked:!1,fav:!1,note:''},{id:8,cat:'🚗 Araba',title:'AdBlue / Motor Yağı',checked:!1,fav:!1,note:''},{id:9,cat:'🏡 Evden Çıkış',title:'Su Vanası Kapalı',checked:!1,fav:!0,note:''},{id:10,cat:'🏡 Evden Çıkış',title:'Pencereler & Klima Kapalı',checked:!1,fav:!1,note:''},{id:11,cat:'🏡 Evden Çıkış',title:'Elektrikli Cihazlar Fişten Çekildi',checked:!1,fav:!1,note:''},{id:12,cat:'📱 Elektronik',title:'Powerbank %100',checked:!1,fav:!1,note:''},{id:13,cat:'📱 Elektronik',title:'Telefon Şarj Kablosu + Adaptör',checked:!1,fav:!1,note:''},{id:14,cat:'📱 Elektronik',title:'Araç Şarj Cihazı (USB-C/Lightning)',checked:!1,fav:!1,note:''},{id:15,cat:'📄 Belgeler & Para',title:'Kimlik Fotokopisi',checked:!1,fav:!1,note:''},{id:16,cat:'📄 Belgeler & Para',title:'Kredi Kartı / Banka Kartı',checked:!1,fav:!0,note:''},{id:17,cat:'🧦 Kıyafet & Bakım',title:'Güneş Gözlüğü',checked:!1,fav:!1,note:''},{id:18,cat:'🧦 Kıyafet & Bakım',title:'Güneş Kremi',checked:!1,fav:!1,note:''},{id:19,cat:'💊 Sağlık',title:'Düzenli İlaçlar',checked:!1,fav:!0,note:''},{id:20,cat:'💊 Sağlık',title:'Ağrı Kesici / Alerji İlacı',checked:!1,fav:!1,note:''},{id:21,cat:'🍎 Yiyecek',title:'Su & Atıştırmalık',checked:!1,fav:!1,note:''}];
let state={destination:'Dedeağaç',targetDate:'2026-09-05',items:JSON.parse(JSON.stringify(defaultItems)),currentCat:'Tümü',theme:'light',installDismissed:!1};
const randomReminders=["Güneş gözlüğünü arabaya koydun mu? 🕶️","Düzenli kullandığın ilaçları yanına aldın mı? 💊","Telefon şarj kablon valizde mi? 🔌","Yurt dışı çıkış harç pulunu online ödedin mi? 💳","Araba anahtarının yedekini yanına aldın mı? 🔑","Evcil hayvan bırakılacaksa düzenlendi mi? 🐕","Sulama sistemini kapattın mı? 💧","Buzdolabındaki çürüyecek gıdaları temizledin mi? 🥗"];
function init(){let s=localStorage.getItem('tatil_asistani_state');if(s){try{let p=JSON.parse(s);state={...state,...p,items:p.items||state.items}}catch(e){}}document.documentElement.setAttribute('data-theme',state.theme);render();checkInstallPrompt()}
function checkInstallPrompt(){if(state.installDismissed)return;let standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(!standalone&&'serviceWorker'in navigator)setTimeout(()=>document.getElementById('installBanner').classList.add('show'),2000)}
function dismissInstall(){state.installDismissed=!0;saveState();document.getElementById('installBanner').classList.remove('show')}
function saveState(){localStorage.setItem('tatil_asistani_state',JSON.stringify(state))}
function showToast(msg){let t=document.getElementById('toast');t.innerText=msg;t.classList.add('active');setTimeout(()=>t.classList.remove('active'),2500)}
function manualSave(){saveState();showToast('✅ Tüm veriler telefona kaydedildi!')}
function launchConfetti(){let colors=['#34c759','#0A84FF','#ff9500','#ff3b30','#5856d6','#ffcc00'];for(let i=0;i<40;i++){let el=document.createElement('div');el.className='confetti';el.style.left=Math.random()*100+'vw';el.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];el.style.animationDuration=(1+Math.random())+'s';el.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}}
function render(){document.getElementById('destName').innerText=state.destination||'Belirtilmedi';let target=new Date(state.targetDate+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);let diff=Math.ceil((target-today)/(864e5));document.getElementById('countdownText').innerText=diff>0?diff+' gün kaldı':diff===0?'🎉 Bugün gidiş günü!':'🚗 Yoldasın!';let total=state.items.length,checked=state.items.filter(i=>i.checked).length,pct=total?Math.round(checked/total*100):0;document.getElementById('percentText').innerText='%'+pct;document.getElementById('progressFill').style.width=pct+'%';let st=document.getElementById('statusText');if(pct===100){st.innerText='🎉 Tatile Hazırsın!';if(!state.celebrated){state.celebrated=!0;launchConfetti();saveState()}}else{st.innerText='Hazırlık Devam Ediyor';state.celebrated=!1}let cats=['Tümü','⭐ Favoriler',...new Set(state.items.map(i=>i.cat))];document.getElementById('catChips').innerHTML=cats.map(c=>{let count=c==='Tümü'?state.items.length:c==='⭐ Favoriler'?state.items.filter(i=>i.fav).length:state.items.filter(i=>i.cat===c).length;return`<div class="cat-chip ${state.currentCat===c?'active':''}" onclick="setCategory('${c}')">${c} <span style="opacity:.7;font-size:11px">${count}</span></div>`}).join('');let search=document.getElementById('searchInput').value.toLowerCase().trim(),filtered=state.items.filter(item=>{let mc=state.currentCat==='Tümü'?!0:state.currentCat==='⭐ Favoriler'?item.fav:item.cat===state.currentCat;return mc&&(!search||item.title.toLowerCase().includes(search)||item.cat.toLowerCase().includes(search))});let lc=document.getElementById('itemList');if(!filtered.length){lc.innerHTML='<div class="empty-state"><span class="emoji">🔍</span><p>Sonuç bulunamadı</p></div>'}else{lc.innerHTML=filtered.map((item,idx)=>`<div class="item-card ${item.checked?'checked':''}" style="animation-delay:${idx*.05}s"><div class="item-main"><div class="item-left"><div class="checkbox" onclick="toggleCheck(${item.id})">${item.checked?'✓':''}</div><div><div class="item-title">${item.title}</div><div style="font-size:12px;color:var(--ts);font-weight:500">${item.cat}</div></div></div><div class="item-actions"><span class="star-btn ${item.fav?'active':''}" onclick="toggleFav(${item.id})">★</span><span class="delete-btn" onclick="deleteItem(${item.id})">🗑️</span></div></div><input type="text" class="item-note-input" placeholder="📝 Not ekle..." value="${item.note||''}" onchange="updateNote(${item.id},this.value)"></div>`).join('')}}
function setCategory(cat){state.currentCat=cat;render()}
function toggleCheck(id){let item=state.items.find(i=>i.id===id);if(item){item.checked=!item.checked;saveState();render()}}
function toggleFav(id){let item=state.items.find(i=>i.id===id);if(item){item.fav=!item.fav;saveState();render()}}
function updateNote(id,note){let item=state.items.find(i=>i.id===id);if(item){item.note=note;saveState()}}
function deleteItem(id){if(confirm('Bu öğeyi silmek istediğinize emin misiniz?')){state.items=state.items.filter(i=>i.id!==id);saveState();render()}}
function addItem(){let title=document.getElementById('newItemTitle').value.trim(),cat=document.getElementById('newItemCat').value;if(!title){showToast('⚠️ Lütfen bir eşya adı girin');return}state.items.push({id:Date.now(),cat,title,checked:!1,fav:!1,note:''});document.getElementById('newItemTitle').value='';saveState();render();showToast('✅ Eklendi!')}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',state.theme);saveState()}
function resetAll(){if(confirm('Tüm işaretlemeler sıfırlansın mı?')){state.items.forEach(i=>i.checked=!1);state.celebrated=!1;saveState();render();showToast('🔄 Sıfırlandı')}}
function forgotCheck(){showToast('🎲 '+randomReminders[Math.floor(Math.random()*randomReminders.length)])}
function openModal(id){document.getElementById('settingDest').value=state.destination;document.getElementById('settingDate').value=state.targetDate;document.getElementById(id).classList.add('active')}
function closeModal(id){document.getElementById(id).classList.remove('active')}
function saveSettings(){let nd=document.getElementById('settingDest').value.trim(),ndt=document.getElementById('settingDate').value;if(!nd){showToast('⚠️ Lütfen bir destinasyon girin');return}if(!ndt){showToast('⚠️ Lütfen bir tarih seçin');return}state.destination=nd;state.targetDate=ndt;saveState();render();closeModal('settingsModal');showToast('✅ Ayarlar güncellendi!')}
window.onclick=function(e){if(e.target.classList.contains('modal'))e.target.classList.remove('active')}
document.getElementById('newItemTitle').addEventListener('keypress',function(e){if(e.key==='Enter')addItem()});
window.onload=init;
</script>
</body>
</html>
